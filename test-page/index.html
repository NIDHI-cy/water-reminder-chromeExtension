<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Water Reminder - Preview</title>
  <style>
    body {
      background: #f4efe4;
      background-image: 
        linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #1a1a1a;
    }

    .box {
      background: #ffffff;
      padding: 32px 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e8e2d2;
      text-align: center;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .duck-preview {
      width: 90px;
      height: auto;
      animation: bob 2.5s ease-in-out infinite;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
    }

    p {
      color: #666;
      font-size: 14px;
      margin: 0;
      line-height: 1.4;
    }

    .btn {
      background: #2b3a2f;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(43,58,47,0.2);
      transition: transform 0.15s, background 0.15s;
    }

    .btn:hover {
      background: #1e2921;
      transform: translateY(-1.5px);
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="../assets/characters/duck.png" alt="Duck" class="duck-preview">
    <h1>Duck's Water Reminder</h1>
    <p>Every 30 minutes, Duck will gently pop up in the top-right corner to remind you to drink water. 💧</p>
    <button class="btn" id="btn-trigger">Test Duck Reminder Now 🦆</button>
  </div>

  <script src="../content/content-script.js"></script>
  <script>
    document.getElementById('btn-trigger').addEventListener('click', () => {
      window.postMessage({
        type: 'MAX_SHOW_REMINDER',
        data: {
          quote: "Quack! 💧 Time to drink some water.",
          soundEnabled: true
        }
      }, '*');
    });

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'MAX_SHOW_REMINDER' && window.chrome?.runtime?.onMessage) {
        // Test message
      }
    });
  </script>
</body>
</html>
