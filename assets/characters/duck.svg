<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- Legs and Feet -->
  <g stroke="#222" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Leg -->
    <line x1="42" y1="84" x2="38" y2="98" stroke="#e67e22" />
    <line x1="42" y1="84" x2="38" y2="98" stroke="#222" stroke-width="5" />
    <line x1="42" y1="84" x2="38" y2="98" stroke="#e67e22" stroke-width="3.5" />

    <!-- Right Leg -->
    <line x1="52" y1="84" x2="48" y2="98" stroke="#222" stroke-width="5" />
    <line x1="52" y1="84" x2="48" y2="98" stroke="#e67e22" stroke-width="3.5" />

    <!-- Feet Platform / Webbed Toes -->
    <path d="M 28 100 L 58 100" stroke="#222" stroke-width="6" stroke-linecap="round" />
    <path d="M 32 98 L 52 98" stroke="#e67e22" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Duck Body Outline and Fill -->
  <!-- Tail Feathers -->
  <path d="M 72 65 C 78 58, 86 52, 88 56 C 89 60, 84 68, 88 64 C 91 61, 92 68, 86 74 C 78 82, 65 86, 45 86 C 28 86, 20 74, 20 60 C 20 48, 30 42, 38 42 C 40 42, 45 43, 48 45 Z"
        fill="#ffffff" stroke="#222" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Tail grey wing shading -->
  <path d="M 70 66 C 76 60, 84 55, 87 58 C 88 62, 83 69, 87 65 C 89 62, 90 68, 85 73 C 78 80, 68 83, 56 83 L 64 68 Z"
        fill="#d2d6dc" />

  <!-- Chestnut Chest -->
  <path d="M 22 55 C 22 46, 28 42, 38 42 C 34 52, 34 68, 22 74 C 20 68, 22 60, 22 55 Z"
        fill="#8d4f2b" stroke="#222" stroke-width="4.5" stroke-linejoin="round" />

  <!-- White Neck Collar Ring -->
  <path d="M 30 42 C 35 44, 45 44, 50 42" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Duck Head (Emerald Green) -->
  <path d="M 32 40 C 28 36, 28 26, 34 18 C 40 10, 52 10, 58 18 C 64 26, 60 38, 50 42 C 42 44, 34 43, 32 40 Z"
        fill="#1e7e34" stroke="#222" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Eye -->
  <circle cx="48" cy="24" r="3" fill="#222" />
  <circle cx="49" cy="23" r="1" fill="#fff" />

  <!-- Yellow / Orange Bill (Beak) -->
  <path d="M 33 24 C 28 24, 18 24, 15 28 C 14 30, 16 34, 22 34 C 28 34, 32 32, 34 30 Z"
        fill="#f5a623" stroke="#222" stroke-width="4.5" stroke-linejoin="round" />
</svg>
