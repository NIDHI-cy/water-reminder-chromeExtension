<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="maxBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a1645" />
      <stop offset="65%" stop-color="#140c24" />
      <stop offset="100%" stop-color="#0a0614" />
    </radialGradient>

    <!-- Red / Auburn Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="35%" stop-color="#e63946" />
      <stop offset="70%" stop-color="#c1121f" />
      <stop offset="100%" stop-color="#780000" />
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba" />
      <stop offset="100%" stop-color="#f8c291" />
    </linearGradient>

    <!-- Jacket Colors -->
    <linearGradient id="jacketMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3557" />
      <stop offset="100%" stop-color="#0b1b32" />
    </linearGradient>
    <linearGradient id="jacketYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- Neon Rim Glow -->
    <filter id="retroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="avatarCircle">
      <circle cx="100" cy="100" r="92" />
    </clipPath>
  </defs>

  <!-- Outer Neon Rings -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.4" />
  <circle cx="100" cy="100" r="94" fill="none" stroke="#00f5d4" stroke-width="3" filter="url(#retroGlow)" />

  <!-- Avatar Content Inside Circle Clip -->
  <g clip-path="url(#avatarCircle)">
    <!-- Dark Synthwave Sky -->
    <rect x="0" y="0" width="200" height="200" fill="url(#maxBg)" />

    <!-- 80s Grid Lines -->
    <g opacity="0.25" stroke="#ff007f" stroke-width="1">
      <line x1="20" y1="140" x2="180" y2="140" />
      <line x1="15" y1="160" x2="185" y2="160" />
      <line x1="10" y1="180" x2="190" y2="180" />
      <line x1="100" y1="130" x2="100" y2="200" />
      <line x1="70" y1="130" x2="50" y2="200" />
      <line x1="130" y1="130" x2="150" y2="200" />
    </g>

    <!-- Neon Sun / Horizon Arc -->
    <circle cx="100" cy="135" r="42" fill="#ff007f" opacity="0.15" filter="url(#retroGlow)" />

    <!-- Back Hair Mass -->
    <path d="M 46 95 C 38 60, 60 25, 100 25 C 140 25, 162 60, 154 95 C 158 120, 165 145, 158 170 C 150 155, 148 140, 146 128 C 144 145, 138 165, 126 175 C 120 160, 116 140, 116 130 C 84 130, 80 160, 74 175 C 62 165, 56 145, 54 128 C 52 140, 50 155, 42 170 C 35 145, 42 120, 46 95 Z"
          fill="url(#hairGrad)" />

    <!-- Neck -->
    <path d="M 88 120 L 88 145 C 88 152, 112 152, 112 145 L 112 120 Z" fill="#f4b584" />
    <path d="M 88 125 C 94 133, 106 133, 112 125 Z" fill="#e09f67" opacity="0.5" />

    <!-- 80s Skater Windbreaker Jacket -->
    <!-- Base Navy Body -->
    <path d="M 40 200 L 46 150 C 48 142, 60 138, 76 142 L 88 145 C 96 148, 104 148, 112 145 L 124 142 C 140 138, 152 142, 154 150 L 160 200 Z"
          fill="url(#jacketMain)" />
    <!-- Yellow Colorblock Stripes -->
    <path d="M 45 156 L 68 150 L 84 158 L 78 172 L 56 166 L 43 172 Z" fill="url(#jacketYellow)" />
    <path d="M 155 156 L 132 150 L 116 158 L 122 172 L 144 166 L 157 172 Z" fill="url(#jacketYellow)" />
    <!-- White Accent Stripe -->
    <path d="M 43 174 L 56 168 L 77 174 L 74 180 L 54 175 L 42 181 Z" fill="#ffffff" opacity="0.85" />
    <path d="M 157 174 L 144 168 L 123 174 L 126 180 L 146 175 L 158 181 Z" fill="#ffffff" opacity="0.85" />
    <!-- Zipper -->
    <line x1="100" y1="147" x2="100" y2="200" stroke="#00f5d4" stroke-width="2.5" />

    <!-- Face Shape -->
    <path d="M 68 85 C 68 62, 78 50, 100 50 C 122 50, 132 62, 132 85 C 132 110, 118 126, 100 126 C 82 126, 68 110, 68 85 Z"
          fill="url(#skinGrad)" />

    <!-- Rosy Cheek Glow -->
    <ellipse cx="78" cy="98" rx="8" ry="4" fill="#ff007f" opacity="0.35" />
    <ellipse cx="122" cy="98" rx="8" ry="4" fill="#ff007f" opacity="0.35" />

    <!-- Freckles (Signature Max look) -->
    <circle cx="77" cy="94" r="0.9" fill="#c1121f" opacity="0.6" />
    <circle cx="81" cy="96" r="0.8" fill="#c1121f" opacity="0.6" />
    <circle cx="75" cy="97" r="0.8" fill="#c1121f" opacity="0.6" />
    <circle cx="123" cy="94" r="0.9" fill="#c1121f" opacity="0.6" />
    <circle cx="119" cy="96" r="0.8" fill="#c1121f" opacity="0.6" />
    <circle cx="125" cy="97" r="0.8" fill="#c1121f" opacity="0.6" />

    <!-- Eyebrows (Fiery red/auburn) -->
    <path d="M 76 75 C 80 72, 88 73, 91 76" fill="none" stroke="#c1121f" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 124 75 C 120 72, 112 73, 109 76" fill="none" stroke="#c1121f" stroke-width="2.5" stroke-linecap="round" />

    <!-- Left Eye (Determined, friendly gaze) -->
    <ellipse cx="83" cy="84" rx="4.5" ry="5" fill="#ffffff" />
    <circle cx="84" cy="84" r="3.2" fill="#00b4d8" />
    <circle cx="84" cy="84" r="1.8" fill="#0a0614" />
    <circle cx="85" cy="82.5" r="1" fill="#ffffff" />

    <!-- Right Eye (Slight playful wink/smize) -->
    <ellipse cx="117" cy="84" rx="4.5" ry="5" fill="#ffffff" />
    <circle cx="116" cy="84" r="3.2" fill="#00b4d8" />
    <circle cx="116" cy="84" r="1.8" fill="#0a0614" />
    <circle cx="117" cy="82.5" r="1" fill="#ffffff" />

    <!-- Cute Nose -->
    <path d="M 98 88 Q 100 93 103 92" fill="none" stroke="#d48b52" stroke-width="1.8" stroke-linecap="round" />

    <!-- Playful Confident Smirk -->
    <path d="M 92 104 Q 100 109 109 104" fill="none" stroke="#990000" stroke-width="2.4" stroke-linecap="round" />
    <path d="M 108 103 C 110 103, 112 105, 110 106" fill="none" stroke="#990000" stroke-width="1.8" />

    <!-- Ears -->
    <ellipse cx="68" cy="88" rx="4" ry="7" fill="#f8c291" />
    <ellipse cx="132" cy="88" rx="4" ry="7" fill="#f8c291" />

    <!-- Front Hair Bangs & Waves (Voluminous 80s reddish hair) -->
    <path d="M 64 68 C 66 42, 88 38, 102 38 C 118 38, 134 44, 136 68 C 126 56, 112 55, 98 62 C 86 54, 74 58, 64 68 Z"
          fill="url(#hairHighlight)" />
    <!-- Tendrils framing face -->
    <path d="M 66 65 C 64 78, 62 92, 69 104 C 67 96, 68 84, 71 74 Z" fill="url(#hairGrad)" />
    <path d="M 134 65 C 136 78, 138 92, 131 104 C 133 96, 132 84, 129 74 Z" fill="url(#hairGrad)" />

    <!-- Retro Walkman Headphones resting around neck or over ears -->
    <!-- Metal Headband -->
    <path d="M 60 76 C 58 35, 142 35, 140 76" fill="none" stroke="#cccccc" stroke-width="3" stroke-linecap="round" />
    <path d="M 66 70 C 66 42, 134 42, 134 70" fill="none" stroke="#555555" stroke-width="1.5" />
    <!-- Orange Foam Ear Pads -->
    <rect x="54" y="74" width="10" height="24" rx="5" fill="#ff7b00" stroke="#c1121f" stroke-width="1.5" filter="url(#retroGlow)" />
    <rect x="136" y="74" width="10" height="24" rx="5" fill="#ff7b00" stroke="#c1121f" stroke-width="1.5" filter="url(#retroGlow)" />

    <!-- Glowing Water Companion Orb in Foreground -->
    <g transform="translate(138, 124)">
      <!-- Water Droplet with Face -->
      <path d="M 22 4 C 22 4, 10 18, 10 26 C 10 33, 15 38, 22 38 C 29 38, 34 33, 34 26 C 34 18, 22 4, 22 4 Z"
            fill="#00f5d4" filter="url(#retroGlow)" />
      <!-- Water Drop Highlight -->
      <path d="M 15 22 C 14 26, 16 31, 18 33" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <circle cx="20" cy="16" r="1.5" fill="#ffffff" />
      <!-- Tiny Happy Face -->
      <circle cx="19" cy="25" r="1" fill="#0b1b32" />
      <circle cx="25" cy="25" r="1" fill="#0b1b32" />
      <path d="M 21 28 Q 22 30 23 28" fill="none" stroke="#0b1b32" stroke-width="1" stroke-linecap="round" />
    </g>

    <!-- Retro Neon Text / Badge -->
    <rect x="74" y="180" width="52" height="15" rx="4" fill="#0c0914" stroke="#ff007f" stroke-width="1.5" />
    <text x="100" y="191" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="10" fill="#00f5d4" text-anchor="middle" letter-spacing="2">MAX</text>
  </g>
</svg>
