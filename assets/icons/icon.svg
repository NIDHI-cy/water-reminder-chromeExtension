<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#24143a" />
      <stop offset="100%" stop-color="#0c0914" />
    </radialGradient>

    <!-- Water Drop Neon Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>

    <!-- 80s Retro Headphones Gradient -->
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff5400" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Foam Pads Gradient -->
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGlow)" stroke="#ff007f" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Retro Synth Grid Lines in Background -->
  <path d="M14 84 L114 84 M20 96 L108 96 M32 108 L96 108" stroke="#ff007f" stroke-width="1" stroke-opacity="0.3" />
  <path d="M64 84 L64 120 M44 84 L36 120 M84 84 L92 120" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.3" />

  <!-- Headphone Band (Arching over water drop) -->
  <path d="M 28 66 C 28 26, 100 26, 100 66" fill="none" stroke="url(#headphoneGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 36 60 C 36 34, 92 34, 92 60" fill="none" stroke="#222" stroke-width="2" />

  <!-- Water Droplet Body -->
  <path d="M 64 36 C 64 36, 42 62, 42 78 C 42 90, 52 100, 64 100 C 76 100, 86 90, 86 78 C 86 62, 64 36, 64 36 Z" 
        fill="url(#dropGrad)" filter="url(#neonGlow)" />

  <!-- Drop Inner Highlight / Shine -->
  <path d="M 52 68 C 50 74, 52 82, 56 86" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <circle cx="60" cy="56" r="3" fill="#ffffff" opacity="0.9" />

  <!-- Cute Face on Droplet -->
  <!-- Left Eye (Wink or happy curve) -->
  <path d="M 54 75 Q 58 71 62 75" fill="none" stroke="#0c0914" stroke-width="2.5" stroke-linecap="round" />
  <!-- Right Eye (Open with sparkle) -->
  <circle cx="70" cy="74" r="2.5" fill="#0c0914" />
  <circle cx="71" cy="73" r="1" fill="#ffffff" />
  <!-- Cute Smile -->
  <path d="M 61 80 Q 64 84 67 80" fill="none" stroke="#0c0914" stroke-width="2" stroke-linecap="round" />
  <!-- Cheeks -->
  <circle cx="52" cy="78" r="2" fill="#ff007f" opacity="0.6" />
  <circle cx="74" cy="78" r="2" fill="#ff007f" opacity="0.6" />

  <!-- Retro Foam Ear Pads -->
  <!-- Left Ear Pad -->
  <rect x="22" y="60" width="10" height="22" rx="5" fill="url(#foamGrad)" stroke="#ff5400" stroke-width="1.5" filter="url(#neonGlow)" />
  <!-- Right Ear Pad -->
  <rect x="96" y="60" width="10" height="22" rx="5" fill="url(#foamGrad)" stroke="#ff5400" stroke-width="1.5" filter="url(#neonGlow)" />

  <!-- Small Water Sparkle -->
  <path d="M 96 32 Q 98 28 102 26 Q 98 24 96 20 Q 94 24 90 26 Q 94 28 96 32 Z" fill="#00f5d4" opacity="0.85" />
</svg>
