<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Water Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card-container">
    <!-- Header -->
    <header class="card-header">
      <div class="brand">
        <h1 class="brand-title">Duck <span class="duck-emoji">🦆</span></h1>
        <span class="brand-subtitle">Every 30 minutes</span>
      </div>
      <button class="settings-btn" id="btn-settings" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Settings Menu Overlay -->
    <div class="settings-panel hidden" id="settings-panel">
      <div class="settings-row">
        <span>Reminders Active</span>
        <label class="switch">
          <input type="checkbox" id="toggle-active" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="settings-row">
        <span>Sound Chime</span>
        <label class="switch">
          <input type="checkbox" id="toggle-sound" checked>
          <span class="slider"></span>
        </label>
      </div>
      <button class="btn-subtle" id="btn-reset">Reset Timer</button>
    </div>

    <!-- Status Pill -->
    <div class="status-pill" id="status-pill">
      <span>Hydration check pending.</span>
      <span class="pill-icon">📝</span>
    </div>

    <!-- Center Duck Illustration -->
    <div class="duck-hero">
      <img src="../assets/characters/duck.png" alt="Cute Duck" class="duck-img" id="duck-img">
    </div>

    <!-- Large Bold Countdown Timer -->
    <div class="countdown" id="countdown-timer">30:00</div>
    <div class="subtext" id="status-subtext">Duck is waiting...</div>

    <!-- Quick "I Drank 💧" Button -->
    <button class="btn-drink" id="btn-drink">
      <span>I Drank 💧</span>
    </button>

    <!-- Footer -->
    <footer class="card-footer">
      <span class="footer-icon">🦆</span>
      <span>Duck is on duty.</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
